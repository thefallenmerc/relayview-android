plugins { id 'com.android.application' }

// Fetch once at build time. The phone loads the verified model from APK assets.
abstract class PrepareDetectionModel extends DefaultTask {
    @OutputDirectory abstract DirectoryProperty getOutputDirectory()
    @TaskAction void fetch() {
        def modelHash = 'c789161ed43c8269fcd4e67c67eeeb4e80c622da2eb296a20bc6007bd18a0b7d'
        def conn = new URI('https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_nano.onnx').toURL().openConnection()
        conn.connectTimeout = 20000
        conn.readTimeout = 60000
        byte[] bytes = conn.inputStream.withCloseable { it.bytes }
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
        if (digest != modelHash) throw new GradleException('YOLOX Nano checksum mismatch')
        def file = outputDirectory.file('yolox_nano.onnx').get().asFile
        file.parentFile.mkdirs()
        file.bytes = bytes
    }
}

android {
    namespace 'app.relayview'
    compileSdk 36
    defaultConfig {
        applicationId 'app.relayview'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk false
        }
    }
}

androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    def task = tasks.register("prepare${variant.name.capitalize()}DetectionModel", PrepareDetectionModel)
    variant.sources.assets.addGeneratedSourceDirectory(task) { it.outputDirectory }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'org.videolan.android:libvlc-all:3.7.2'
    testImplementation 'junit:junit:4.13.2'
}
